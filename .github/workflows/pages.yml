name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Add website version metadata
        run: |
          printf '{"date":"%s","run":"%s","commit":"%s"}\n' \
            "$(date -u +%Y.%m.%d)" \
            "$GITHUB_RUN_NUMBER" \
            "$(git rev-parse --short=7 HEAD)" > version.json
      - name: Generate SEO event pages
        env:
          SUPABASE_URL: https://zvhvofgpizwhtxmcnghm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8tGj45KNbpGERTyOtC2Cfg_IiFh9myI
        run: node scripts/generate-event-pages.mjs
      - name: Assemble website artifact
        run: |
          cp -R generated-site/event .
          cp generated-site/sitemap.xml generated-site/robots.txt .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
