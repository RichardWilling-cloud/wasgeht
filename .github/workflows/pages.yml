name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Build website (static files, SEO event pages, sitemap)
        env:
          SUPABASE_URL: https://zvhvofgpizwhtxmcnghm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8tGj45KNbpGERTyOtC2Cfg_IiFh9myI
          SITE_VERSION_RUN: ${{ github.run_number }}
          SITE_VERSION_COMMIT: ${{ github.sha }}
        run: |
          export SITE_VERSION_DATE="$(date -u +%Y.%m.%d)"
          export SITE_VERSION_COMMIT="${SITE_VERSION_COMMIT:0:7}"
          node scripts/build-site.mjs
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
